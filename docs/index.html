<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Y2K Lister</title>

<!-- PWA manifest — this is a real static site with full control over
     its own <head>, unlike the Streamlit Cloud app itself (Streamlit
     Cloud's own base template wins the "first manifest/icon tag"
     race when you try to inject these directly into a Streamlit app,
     which is why this wrapper exists at all). -->
<link rel="manifest" href="manifest.json">

<!-- iOS "Add to Home Screen" tags. These are what make it open
     standalone (no Safari address bar/toolbar) instead of as a
     regular bookmark.

     status-bar-style is "default", not "black-translucent". Translucent
     mode makes content extend full-screen BEHIND a status bar that is
     ALWAYS a dark semi-transparent black tint — that's what "black" in
     "black-translucent" means, not "shows your color through it". No
     background fill color can change that; it was the actual cause of
     the dark bar at the top instead of the brand cream. "default" makes
     iOS render its own normal, opaque, light status bar and — the
     important part — automatically reserve that space so content starts
     BELOW it, with no manual safe-area-inset-top handling needed here
     at all. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Y2K Lister">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Android / general PWA equivalents -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F02AA0">
<link rel="icon" href="icon-192.png">

<style>
  /* 100dvh (dynamic viewport height), not 100%/100vh — those don't
     reliably match the true visible screen in iOS standalone-PWA mode. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: #FBF3E3;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* Shown only for the instant before the redirect below fires (or if
     JS is disabled — see the <noscript> fallback), so there's never a
     blank white flash on launch. */
  .splash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .splash img { width: 96px; height: 96px; border-radius: 22px; }
  .splash .spinner {
    width: 22px; height: 22px;
    border: 3px solid rgba(240, 42, 160, .18);
    border-top-color: #F02AA0;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .offline-banner {
    position: fixed;
    left: 0; right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    z-index: 20;
    display: none;
    padding: 10px 16px;
    background: #2B2130;
    color: #FBF3E3;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .offline-banner.show { display: block; }
</style>
</head>
<body>
  <!-- No iframe here on purpose. This app was previously embedded in an
       <iframe> pointing at the real Streamlit Cloud app — but from
       inside a standalone, "Added to Home Screen" PWA on iOS, that made
       every cookie the login session depends on a cross-site,
       THIRD-PARTY cookie, which iOS's WKWebView (the engine standalone
       PWAs run in) blocks/discards far more aggressively than Safari
       proper. That's what silently broke "stay logged in" on the
       home-screen app specifically, while working fine in a normal
       Safari tab. Redirecting the TOP-LEVEL page here to the real app
       instead makes it first-party from the browser's point of view —
       the manifest/icons below still make this installable as its own
       home-screen app (the redirect happens inside that same standalone
       shell), it just no longer iframes the real thing. -->
  <div class="splash" id="splash">
    <img src="icon-192.png" alt="">
    <div class="spinner"></div>
  </div>
  <div class="offline-banner" id="offlineBanner">
    You're offline — Y2K Lister needs an internet connection.
  </div>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://y2klister.streamlit.app/?embed=true&embed_options=light_theme">
    <p style="text-align:center; margin-top:40vh; font-family:sans-serif;">
      <a href="https://y2klister.streamlit.app/?embed=true&embed_options=light_theme">Open Y2K Lister</a>
    </p>
  </noscript>

  <script>
    var DEST = "https://y2klister.streamlit.app/?embed=true&embed_options=light_theme";

    function updateOnlineStatus() {
      var banner = document.getElementById('offlineBanner');
      if (navigator.onLine) {
        banner.classList.remove('show');
      } else {
        banner.classList.add('show');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    if (navigator.onLine) {
      window.location.replace(DEST);
    } else {
      // Wait for connectivity instead of redirecting straight into a
      // browser-native offline error page.
      window.addEventListener('online', function () {
        window.location.replace(DEST);
      });
    }
  </script>
</body>
</html>
