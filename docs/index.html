<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Y2K Lister</title>

<!-- PWA manifest — this is a real static site with full control over
     its own <head>, unlike the Streamlit Cloud app itself (Streamlit
     Cloud's own base template wins the "first manifest/icon tag"
     race when you try to inject these directly into a Streamlit app,
     which is why this wrapper exists at all). -->
<link rel="manifest" href="manifest.json">

<!-- iOS "Add to Home Screen" tags. These are what make it open
     standalone (no Safari address bar/toolbar) instead of as a
     regular bookmark. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Y2K Lister">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Android / general PWA equivalents -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F02AA0">
<link rel="icon" href="icon-192.png">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #FBF3E3;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* Reserves real space for the iOS status bar / notch area, filled
     with the brand cream color, instead of letting the iframe's
     content sit underneath it (status-bar-style is translucent, so
     without this the top of the embedded app would be covered). */
  .status-bar-fill {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top, 0px);
    background: #FBF3E3;
    z-index: 10;
  }
  iframe {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    width: 100%;
    height: calc(100% - env(safe-area-inset-top, 0px));
    border: 0;
    background: #FBF3E3;
  }
  .offline-banner {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    display: none;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: #2B2130;
    color: #FBF3E3;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .offline-banner.show { display: block; }
</style>
</head>
<body>
  <div class="status-bar-fill"></div>
  <iframe
    src="https://y2klister.streamlit.app/?embed=true&embed_options=light_theme"
    title="Y2K Lister"
    allow="clipboard-write; fullscreen"
  ></iframe>
  <div class="offline-banner" id="offlineBanner">
    You're offline — Y2K Lister needs an internet connection.
  </div>

  <script>
    function updateOnlineStatus() {
      var banner = document.getElementById('offlineBanner');
      if (navigator.onLine) {
        banner.classList.remove('show');
      } else {
        banner.classList.add('show');
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
</body>
</html>
